name: BlueMapMini
version: '${version}'
main: com.extantape.bluemapmini.BlueMapMiniPlugin
api-version: '26.1'
description: A BlueMap minimap and coordinates HUD, with a fullscreen map, drawn with a resource pack font.
website: https://github.com/ExtantApe/BlueMapMini
# Commands are registered with Brigadier in code, so there is no commands section.
dependencies:
  server:
    # BlueMap must load first, and its API classes must be visible to this plugin.
    BlueMap:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional, for spotting Bedrock players. Reached by reflection, so it needs the classpath too.
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  bluemapmini.use:
    description: See and control the minimap.
    default: true
  bluemapmini.fullscreen:
    description: Open the fullscreen map.
    default: true
  bluemapmini.seeplayers:
    description: See other players on the map.
    default: true
  bluemapmini.share.send:
    description: Share your coordinates with /hud share.
    default: true
  bluemapmini.share.receive:
    description: Receive coordinates other players share.
    default: true
  bluemapmini.admin:
    description: Use /bluemapmini reload, debug and pack commands.
    default: op
