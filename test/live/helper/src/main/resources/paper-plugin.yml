name: LiveTestHelper
version: '1'
main: com.extantape.bluemapmini.livetest.Helper
api-version: '26.1'
description: Test only. Lets the live tests act like other plugins. Never install it on a real server.
dependencies:
  server:
    BlueMap:
      load: BEFORE
      required: true
      join-classpath: true
    # For the share tests: listens to CoordinateShareEvent the way a server's chat rules plugin would.
    BlueMapMini:
      load: BEFORE
      required: true
      join-classpath: true
